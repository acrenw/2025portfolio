<div class="game-container">
  <canvas #gameCanvas
          class="game-canvas"
          (window:resize)="onResize()">
  </canvas>

  <!-- controls widget expanded -->
  <div class="controls-widget" *ngIf="!controlsMinimized">
    <img src="assets/images/controls-bg.png" class="controls-bg"  alt="">
    <img src="assets/images/controls.png" class="controls-img" alt="Controls: WASD/arrows to move, Z to select, X to cancel">
    <div class="minimize-btn" (click)="setControlsMinimized(true)"></div>
  </div>

  <!-- controls widget minimized -->
  <img *ngIf="controlsMinimized"
       src="assets/images/controls-minimized.png"
       class="controls-minimized-icon"
       alt="Expand controls"
       (click)="setControlsMinimized(false)">

  <!-- dialog box popup -->
  <div class="dialog-overlay" *ngIf="showPopup">
    <div class="dialog-box" (click)="closePopup()">
      <img src="assets/images/dialog-box.png" class="dialog-bg" alt="">
      <div class="dialog-text" [innerHTML]="getFormattedText()"></div>
      <div class="dialog-close-btn" (click)="closePopup(); $event.stopPropagation()"></div>
    </div>
  </div>
</div>
